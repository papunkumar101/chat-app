<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button type="submit" onclick="SendMessage(event)">Send</button>
    </form>
    <!-- <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script> -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io("http://localhost:3000");
    let username;
    document.addEventListener("DOMContentLoaded", function() {
        joinChat()
    });
        

// join to chat 
function joinChat() {
    const messageSendTo = document.location.search; 
    if (!messageSendTo) return alert("Invalide username");
    const searchparamObj = new URLSearchParams(messageSendTo);
    
    let message = {
        type : "connection",
        receiver : searchparamObj.get('to')
    }
    socket.emit("message", JSON.stringify(message));
    // document.getElementById("chat-box").style.display = "block";
}


// send messages 
function SendMessage(e) {
    e.preventDefault();
    const messageSendTo = document.location.search; 
    if (!messageSendTo) return alert("Invalide username");
    const searchparamObj = new URLSearchParams(messageSendTo);
    
    const form = document.getElementById('form');
    let inputTxt = document.getElementById("input").value;
    if (!inputTxt) return;

    let message = {
        type : "send_message",
        receiver : searchparamObj.get('to'),
        message : inputTxt,
    } 
    socket.emit("message", JSON.stringify(message));
    inputTxt = ''; 
}
 

// listen the connection, success, error & messages 
socket.on("receive_message", (data) => {
    console.log('receive_message', data);
    const messagesDiv = document.getElementById("messages");
    messagesDiv.innerHTML += `<p><strong>${data.sender}:</strong> ${data.message}</p>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
});
socket.on("connected", (data) => {
    alert(`Welcome, ${data.username}! You are now connected.`);
});
socket.on("error", (err) => {
    console.error("error:", err);
    alert(`Error : ${err}`);
});
    </script>
    </body>
</html>
