<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ChatApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #075e54;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-signup {
            background-color: #25d366;
            color: white;
        }
        .btn-signup:hover {
            background-color: #1da851;
        }
        #message {
            color: #d9534f;
            margin-top: 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0; 
            position: absolute;
            z-index: 1;
        }

        .tooltip:hover .tooltiptext {
           visibility: visible;
        }
        .min-width-set{
            min-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container min-width-set">
        <h1>Sign Up</h1>
        <form id="signup-form">
            <label for="username">Username <div class="tooltip"><i class="fa fa-info-circle"></i>
                <span class="tooltiptext">username should not be special char or any space</span>
              </div> :</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email <div class="tooltip"><i class="fa fa-info-circle"></i>
                <span class="tooltiptext">verification link will send to your given mail ID</span>
              </div> :</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password :</label>
            <input type="password" id="password" name="password" required>

            <label for="cpassword">Confirm Password :</label>
            <input type="cpassword" id="cpassword" name="cpassword" required>

             
            <button type="submit" class="btn btn-signup">Register</button>
        </form>
        <p id="message"></p>
    </div>
    <div class="footer">Powered by Papun &copy; <script>document.write(new Date().getFullYear());</script> | <a href="/">Back to home</a></div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(event) {
            event.preventDefault();  
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const cpassword = document.getElementById('cpassword').value;
            const email = document.getElementById('email').value;
            let messageBox = document.getElementById('message');
            messageBox.textContent = ''; 

            if (!username || !password || !cpassword || !email) {
                messageBox.textContent = ('All fields are required.');
                return;
            }

            const usernameRegex = /^[a-zA-Z0-9]+$/;
            if (!usernameRegex.test(username)) {
                messageBox.textContent = ('Username should not contain spaces or special characters.');
                return;
            }

            if (password !== cpassword) {
                messageBox.textContent = ('Passwords do not match.');
                return;
            }
             
            const data = { username, password, cpassword, email }; 
            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                let resp = data.data ?? data.error;
                messageBox.textContent = resp;
                if(resp == 'Successfully created') {
                    messageBox.style.color = '#1da851';
                    setTimeout(()=> {
                        document.location.href = '/signin';
                    },1000);
                }
                if(resp == 'User already exist') messageBox.style.color = '#d9534f';
            })
            .catch(error => {
                messageBox.textContent = 'An error occurred. Please try again later.';
                console.error('Error:', error); 
            });
        });
    </script>
</body>
</html>
